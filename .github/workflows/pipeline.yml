name: Hub2Hub Lead Pipeline

on:
  schedule:
    - cron: '30 7 * * 1'  # Monday 09:30 CET (07:30 UTC)
    - cron: '30 7 * * 3'  # Wednesday 09:30 CET (07:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'How many leads to push?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - one

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          HUBSPOT_OWNER_ID: ${{ secrets.HUBSPOT_OWNER_ID }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "one" ]; then
            python main.py --one
          else
            python main.py --auto
          fi

      - name: Save HubSpot log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hubspot_log.json
          git diff --staged --quiet || git commit -m "Update HubSpot push log [skip ci]"
          git push
